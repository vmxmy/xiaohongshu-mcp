name: Release Tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build all platforms
        run: make build-all

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/xiaohongshu-mcp-*
            dist/checksums.txt
          body: |
            ## 小红书MCP工具 ${{ steps.version.outputs.VERSION }}

            ### 下载说明

            根据你的操作系统和架构选择对应的文件：

            - **Linux (x86_64)**: `xiaohongshu-mcp-linux-amd64`
            - **Linux (ARM64)**: `xiaohongshu-mcp-linux-arm64`
            - **macOS (Intel)**: `xiaohongshu-mcp-darwin-amd64`
            - **macOS (Apple Silicon)**: `xiaohongshu-mcp-darwin-arm64`
            - **Windows (x86_64)**: `xiaohongshu-mcp-windows-amd64.exe`
            - **Windows (ARM64)**: `xiaohongshu-mcp-windows-arm64.exe`

            ### 安装步骤

            1. 下载对应平台的二进制文件
            2. 重命名为 `xiaohongshu-mcp`（Linux/macOS）或 `xiaohongshu-mcp.exe`（Windows）
            3. 添加执行权限（Linux/macOS）：`chmod +x xiaohongshu-mcp`
            4. 运行：`./xiaohongshu-mcp --help`

            ### 校验和

            请使用 `checksums.txt` 验证下载文件的完整性。
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
